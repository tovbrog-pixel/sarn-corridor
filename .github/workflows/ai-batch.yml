name: AI-vs-AI batch

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Game hours per run (552 = two days of tension and 21 days of war)'
        default: '552'
      label:
        description: 'Short label for the summary file'
        default: 'corridor'
      config:
        description: 'Game version: big (bigger towns, town rules on), bigx (bigger towns, rules off), small (original town sizes, rules off)'
        default: 'big'
      sidediff:
        description: 'Difficulty level per side, Valdenmark,Sarn (0 Staff exercise, 1 Standard, 2 Veteran opponent, 3 Supreme command); empty = none'
        default: ''

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        seed: [101, 102, 103, 104, 105, 106, 107, 108, 109, 110, 111, 112, 113, 114, 115, 116, 117, 118, 119, 120]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          if [ -n "${{ inputs.sidediff }}" ]; then echo "SC_SIDEDIFF=${{ inputs.sidediff }}" >> $GITHUB_ENV; fi
          case "${{ inputs.config }}" in bigx) echo "SC_NOURBAN=1" >> $GITHUB_ENV;; small) echo "SC_NOURBAN=1" >> $GITHUB_ENV; echo "SC_SMALLTOWNS=1" >> $GITHUB_ENV;; esac
      - run: mkdir -p results && node tools/scenario-corridor.js ${{ inputs.hours }} ${{ matrix.seed }} results/run-${{ matrix.seed }}.json | tee results/run-${{ matrix.seed }}.log
      - uses: actions/upload-artifact@v4
        with: { name: 'run-${{ inputs.config }}-${{ matrix.seed }}', path: results/ }
  summary:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { path: all, pattern: 'run-${{ inputs.config }}-*', merge-multiple: true }
      - run: |
          mkdir -p docs/tests
          f=docs/tests/batch-$(date -u +%Y%m%d-%H%M)-${{ inputs.label }}.md
          node tools/batch-summary.js all "$f"
          mkdir -p "${f%.md}" && cp all/*.json "${f%.md}/" 2>/dev/null || true
          git config user.name "Tov Binyamin Brog"
          git config user.email "tovbrog-pixel@users.noreply.github.com"
          git add docs/tests
          git diff --cached --quiet || git commit -m "AI-vs-AI batch results (${{ inputs.label }})"
          git pull --rebase
          git push
